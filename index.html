<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MartiNews — Candidature Saison 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090c;
    --panel:#111318;
    --line:#22262f;
    --cyan:#22c6e0;
    --cyan-dim:#1595a8;
    --coral:#ef6d6d;
    --coral-dim:#c94f4f;
    --cream:#eef1f5;
    --cream-dim:#8b93a3;
    --ok:#5fd3a0;
    --err:#ef6d6d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Space Grotesk', sans-serif;
    background:#060708;
    color:var(--cream);
    min-height:100vh;
    padding:0 0 32px;
    position:relative;
    overflow-x:hidden;
  }

  /* ---- Full-page perspective grid background ---- */
  .grid-perspective{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(239,109,109,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(239,109,109,.16) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:linear-gradient(to bottom, black, black 55%, transparent 95%);
    mask-image:linear-gradient(to bottom, black, black 55%, transparent 95%);
    transform:perspective(600px) rotateX(62deg) scale(2);
    transform-origin:center 15%;
    opacity:.55;
    animation:driftGrid 14s linear infinite;
  }
  @keyframes driftGrid{
    from{background-position:0 0;}
    to{background-position:0 56px;}
  }
  @media (prefers-reduced-motion: reduce){.grid-perspective{animation:none;}}

  /* ---- Hero ---- */
  .hero{
    position:relative;
    z-index:1;
    background:radial-gradient(700px 400px at 50% 0%, rgba(34,198,224,.12), transparent 65%);
    padding:56px 20px 48px;
    text-align:center;
  }
  .hero-content{position:relative; z-index:1;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border:1px solid rgba(34,198,224,.4);
    border-radius:999px;
    background:rgba(34,198,224,.08);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-bottom:22px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,198,224,.55);}
    70%{box-shadow:0 0 0 8px rgba(34,198,224,0);}
    100%{box-shadow:0 0 0 0 rgba(34,198,224,0);}
  }
  @media (prefers-reduced-motion: reduce){.dot{animation:none;}}

  h1{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size:clamp(36px, 8vw, 56px);
    line-height:.98;
    letter-spacing:-.01em;
    margin:0 0 16px;
    color:var(--cream);
    text-shadow:0 0 40px rgba(239,109,109,.15);
  }
  h1 em{
    font-style:normal;
    color:var(--coral);
    text-decoration:underline;
    text-decoration-color:rgba(239,109,109,.5);
    text-underline-offset:8px;
    text-decoration-thickness:3px;
  }
  .hero p{
    font-size:16px;
    line-height:1.55;
    color:var(--cream-dim);
    max-width:44ch;
    margin:0 auto;
  }

  /* ---- Form ---- */
  .wrap{max-width:600px; margin:-16px auto 0; padding:0 18px; position:relative; z-index:2;}

  .panel{
    background:rgba(17,19,24,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    animation:panelIn .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes panelIn{
    from{opacity:0; transform:translateY(24px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .panel-inner{
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 24px;
    background:linear-gradient(180deg, rgba(34,198,224,.05), transparent 40%);
  }

  .status{
    display:none;
    align-items:center;
    gap:10px;
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:500;
    margin-bottom:20px;
  }
  .status.success{display:flex; background:rgba(95,211,160,.1); color:var(--ok); border:1px solid rgba(95,211,160,.3);}
  .status.error{display:flex; background:rgba(239,109,109,.1); color:var(--err); border:1px solid rgba(239,109,109,.3);}

  .field{margin-bottom:18px; opacity:0; animation:fieldIn .5s ease forwards;}
  .field:nth-of-type(1){animation-delay:.05s;}
  .field:nth-of-type(2){animation-delay:.1s;}
  .field:nth-of-type(3){animation-delay:.15s;}
  .field:nth-of-type(4){animation-delay:.2s;}
  .field:nth-of-type(5){animation-delay:.25s;}
  .field:nth-of-type(6){animation-delay:.3s;}
  @keyframes fieldIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .field{animation:none; opacity:1;}
  }
  .row{display:flex; gap:14px;}
  .row .field{flex:1; min-width:0; margin-bottom:0;}
  .row{margin-bottom:18px;}

  label{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin-bottom:8px;
  }
  label .req{color:var(--coral);}
  label .opt{font-size:10px; color:#565c68; text-transform:none; letter-spacing:0;}

  input, textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    font-family:'Space Grotesk', sans-serif;
    background:#0b0d11;
    color:var(--cream);
    transition:border-color .2s, box-shadow .2s, transform .15s, background .2s;
  }
  input::placeholder, textarea::placeholder{color:#4c5260;}
  input:hover, textarea:hover{border-color:#3a4150;}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--cyan);
    box-shadow:0 0 0 4px rgba(34,198,224,.14);
    background:#0d1015;
    transform:translateY(-1px);
  }
  textarea{resize:vertical; min-height:96px; line-height:1.5;}

  .file-hidden{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .filedrop{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:12px 14px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    font-size:14px;
    color:var(--cream-dim);
    background:#0b0d11;
    cursor:pointer;
    transition:border-color .2s, background .2s, color .2s;
  }
  .filedrop::before{
    content:"📎";
    font-size:15px;
  }
  .filedrop:hover{border-color:var(--cyan); color:var(--cream);}
  .filedrop.has-file{
    border-style:solid;
    border-color:var(--cyan-dim);
    color:var(--cream);
    background:rgba(34,198,224,.06);
  }
  .filedrop.file-error{
    border-color:var(--coral);
    color:var(--coral);
    background:rgba(239,109,109,.06);
  }

  .upload-progress{
    display:none;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .upload-progress.active{display:flex;}
  .upload-progress-track{
    flex:1;
    height:8px;
    border-radius:999px;
    background:#181b21;
    overflow:hidden;
  }
  .upload-progress-bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--cyan), var(--coral));
    background-size:200% 100%;
    animation:progressShimmer 1.4s linear infinite;
    transition:width .25s ease;
  }
  @keyframes progressShimmer{
    from{background-position:0% 0;}
    to{background-position:-200% 0;}
  }
  .upload-progress-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    min-width:34px;
    text-align:right;
  }

  button{
    position:relative;
    width:100%;
    padding:16px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:linear-gradient(120deg, var(--cyan) 0%, var(--coral) 100%);
    background-size:200% 200%;
    background-position:0% 50%;
    color:#08090c;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    cursor:pointer;
    overflow:hidden;
    transition:background-position .5s ease, transform .15s ease, box-shadow .25s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  button:hover{
    background-position:100% 50%;
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(34,198,224,.25), 0 10px 26px rgba(239,109,109,.18);
  }
  button:active{transform:translateY(0) scale(.98);}
  button:disabled{opacity:.55; cursor:not-allowed; transform:none; box-shadow:none;}

  /* button shine sweep */
  button::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-20deg);
    transition:left .6s ease;
  }
  button:hover::after{left:140%;}

  .spinner{
    width:15px; height:15px;
    border:2px solid rgba(8,9,12,.35);
    border-top-color:#08090c;
    border-radius:50%;
    animation:spin .6s linear infinite;
    display:none;
  }
  button.loading .spinner{display:inline-block;}
  button.loading .btn-label{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .foot{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:#4c5260;
    margin-top:22px;
  }

  /* ---- Mobile ---- */
  @media (max-width: 480px){
    body{padding:0 0 24px;}

    .hero{padding:32px 16px 32px;}
    .badge{
      padding:6px 12px;
      font-size:10px;
      margin-bottom:16px;
    }
    h1{margin:0 0 12px;}
    .hero p{font-size:14.5px; padding:0 8px;}

    .wrap{margin-top:-10px; padding:0 12px;}
    .panel{border-radius:18px; padding:6px;}
    .panel-inner{padding:20px 16px;}

    /* stack name/class/email fields, no more side-by-side squeeze */
    .row{flex-direction:column; gap:18px; margin-bottom:18px;}
    .row .field{margin-bottom:0;}

    label{font-size:11.5px; margin-bottom:7px;}

    /* 16px min font-size on inputs prevents iOS auto-zoom on focus */
    input, textarea{
      font-size:16px;
      padding:13px 14px;
      border-radius:12px;
    }
    textarea{min-height:110px;}

    /* bigger, thumb-friendly tap target */
    button{
      padding:17px;
      font-size:13.5px;
      border-radius:12px;
    }

    .foot{margin-top:16px; font-size:10px;}

    /* lighten the grid + blur cost a bit on mobile GPUs */
    .grid-perspective{opacity:.4;}
    .panel{backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  }

  @media (max-width: 360px){
    h1{font-size:32px;}
  }
</style>
</head>
<body>

<div class="grid-perspective"></div>

<div class="hero">
  <div class="hero-content">
    <div class="badge"><span class="dot"></span> Recrutement ouvert</div>
    <h1>Rejoins la<br><em>MartiNews.</em></h1>
    <p>La Saison 4 recrute. Anime, écris, monte, présente.</p>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="panel-inner">

      <div id="status" class="status"></div>

      <form id="candidatureForm">
        <div class="row">
          <div class="field">
            <label for="prenom">Prénom <span class="req">*</span></label>
            <input type="text" id="prenom" name="prenom" required placeholder="Léa">
          </div>
          <div class="field">
            <label for="nom">Nom <span class="req">*</span></label>
            <input type="text" id="nom" name="nom" required placeholder="Martin">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="classe">Classe <span class="req">*</span></label>
            <input type="text" id="classe" name="classe" required placeholder="4°B">
          </div>
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" required placeholder="toi@exemple.com">
          </div>
        </div>

        <div class="field">
          <label for="motivation">Motivation <span class="req">*</span></label>
          <textarea id="motivation" name="motivation" required placeholder="Pourquoi MartiNews ? Qu'est-ce que tu as envie d'y faire ?"></textarea>
        </div>

        <div class="field">
          <label for="experience">Expérience <span class="opt">— optionnel</span></label>
          <textarea id="experience" name="experience" placeholder="Radio, prise de parole, montage vidéo... si tu as déjà touché à quelque chose de similaire."></textarea>
        </div>

        <div class="field">
          <label for="pdf">CV / Lettre <span class="opt">— PDF, Word ou image · 10 Mo max</span></label>
          <label for="pdf" class="filedrop" id="filedropLabel">
            <span id="filedropText">Choisir un document…</span>
          </label>
          <input type="file" id="pdf" name="pdf" accept=".pdf,.doc,.docx,.odt,.rtf,.jpg,.jpeg,.png" class="file-hidden">
          <div class="upload-progress" id="uploadProgress">
            <div class="upload-progress-track">
              <div class="upload-progress-bar" id="uploadProgressBar"></div>
            </div>
            <span class="upload-progress-label" id="uploadProgressLabel">0%</span>
          </div>
        </div>

        <button type="submit" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label">Envoyer ma candidature</span>
        </button>
      </form>

    </div>
  </div>

  <p class="foot">Saison 4 · Formulaire officiel MartiNews</p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzemIdy00S6pd74hY0yEqufTRcwPbnZPGNsxBJW6dVjhmCsBjxFhMWOZ4bYyMKIzK7Y/exec";

const form = document.getElementById('candidatureForm');
const btn = document.getElementById('submitBtn');
const status = document.getElementById('status');
const pdfInput = document.getElementById('pdf');
const filedropLabel = document.getElementById('filedropLabel');
const filedropText = document.getElementById('filedropText');
const uploadProgress = document.getElementById('uploadProgress');
const uploadProgressBar = document.getElementById('uploadProgressBar');
const uploadProgressLabel = document.getElementById('uploadProgressLabel');

const MAX_FILE_BYTES = 10 * 1024 * 1024; // 10 Mo
const ALLOWED_EXT = ['pdf', 'doc', 'docx', 'odt', 'rtf', 'jpg', 'jpeg', 'png'];

function getExt(filename){
  return filename.split('.').pop().toLowerCase();
}

pdfInput.addEventListener('change', function(){
  const file = pdfInput.files[0];
  filedropLabel.classList.remove('has-file', 'file-error');

  if (!file) {
    filedropText.textContent = "Choisir un document…";
    return;
  }
  if (!ALLOWED_EXT.includes(getExt(file.name))) {
    filedropText.textContent = "Format non accepté (PDF, Word ou image) — réessaie.";
    filedropLabel.classList.add('file-error');
    pdfInput.value = "";
    return;
  }
  if (file.size > MAX_FILE_BYTES) {
    filedropText.textContent = "Fichier trop lourd (10 Mo max) — réessaie.";
    filedropLabel.classList.add('file-error');
    pdfInput.value = "";
    return;
  }
  filedropText.textContent = "📄 " + file.name + " (" + (file.size / 1024 / 1024).toFixed(1) + " Mo)";
  filedropLabel.classList.add('has-file');
});

function fileToBase64(file, onProgress){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onprogress = function(evt){
      if (evt.lengthComputable && onProgress) {
        // encoding phase = first 40% of the bar
        const pct = Math.round((evt.loaded / evt.total) * 40);
        onProgress(pct);
      }
    };
    reader.onload = function(){
      if (onProgress) onProgress(40);
      // strip the "data:...;base64," prefix
      resolve(reader.result.split(',')[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// IMPORTANT: Apps Script never returns CORS headers, so a normal XHR/fetch
// (cors mode) gets blocked outright — that's the "blocked by CORS policy"
// error. mode:'no-cors' is the only way to actually deliver the request; the
// trade-off is we lose the ability to read the response or track real upload
// progress. We simulate a smooth progress climb (40% → 90%) while the no-cors
// fetch is in flight, then snap to 100% once it resolves.
function sendNoCors(url, payload, onProgress){
  return new Promise(function(resolve){
    let pct = 40;
    const ticker = setInterval(function(){
      pct = Math.min(pct + Math.random() * 8, 90);
      if (onProgress) onProgress(Math.round(pct));
    }, 180);

    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    }).finally(function(){
      clearInterval(ticker);
      resolve();
    });
  });
}

form.addEventListener('submit', async function(e){
  e.preventDefault();

  status.className = 'status';
  status.style.display = 'none';

  const data = {
    prenom: document.getElementById('prenom').value.trim(),
    nom: document.getElementById('nom').value.trim(),
    classe: document.getElementById('classe').value.trim(),
    email: document.getElementById('email').value.trim(),
    motivation: document.getElementById('motivation').value.trim(),
    experience: document.getElementById('experience').value.trim()
  };

  const docFile = pdfInput.files[0];

  btn.classList.add('loading');
  btn.disabled = true;

  if (docFile) {
    uploadProgress.classList.add('active');
    uploadProgressBar.style.width = '0%';
    uploadProgressLabel.textContent = '0%';
  }

  const setPct = function(pct){
    uploadProgressBar.style.width = pct + '%';
    uploadProgressLabel.textContent = pct + '%';
  };

  if (docFile) {
    try {
      data.pdfName = docFile.name;
      data.pdfBase64 = await fileToBase64(docFile, setPct);
    } catch (err) {
      status.textContent = "✕ Impossible de lire le fichier. Réessaie sans document ou avec un autre.";
      status.className = 'status error';
      status.scrollIntoView({behavior:'smooth', block:'center'});
      btn.classList.remove('loading');
      btn.disabled = false;
      uploadProgress.classList.remove('active');
      return;
    }
  }

  try {
    // POST required here: a base64-encoded document is far too large for a GET URL.
    await sendNoCors(SCRIPT_URL, JSON.stringify(data), docFile ? setPct : null);

    if (docFile) setPct(100);

    status.textContent = "✓ Candidature envoyée. On revient vers toi vite !";
    status.className = 'status success';
    form.reset();
    filedropText.textContent = "Choisir un document…";
    filedropLabel.classList.remove('has-file', 'file-error');

  } catch (err) {
    status.textContent = "✕ Erreur d'envoi. Réessaie ou écris directement à l'équipe.";
    status.className = 'status error';
    console.error(err);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    setTimeout(function(){
      uploadProgress.classList.remove('active');
      uploadProgressBar.style.width = '0%';
      uploadProgressLabel.textContent = '0%';
    }, 900);
    status.scrollIntoView({behavior:'smooth', block:'center'});
    sendHeight();
  }
});

/* ---- Auto-resize: tell the parent page (iframe host) our real height ---- */
function sendHeight(){
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'martinews-form-height', height: h }, '*');
}
window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
// content height can change after fonts load or field animations settle
setTimeout(sendHeight, 300);
setTimeout(sendHeight, 1000);
new ResizeObserver(sendHeight).observe(document.body);
</script>

</body>
</html>
